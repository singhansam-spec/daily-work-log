<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일일업무 로그</title>
<link href="https://script.google.com/a/macros/ekdp.com/s/AKfycbypP7wGlUsyX40DtEluWt1FDcavOnJVVxenkCGlkh4b3oQNcabZV_Qwv00TJA32I6iDog/exec" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--cd:#fff;--bd:#e2e6ee;--tx:#1b2030;--mu:#6b7385;--ac:#2456d6;--acb:#eaf0ff;--ok:#12803c;--okb:#e8f7ee;--wa:#b45309;--wab:#fff4e0}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:14px/1.55 'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
header{background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.hd,.w{max-width:960px;margin:0 auto;padding:12px 14px}.hd{display:flex;align-items:center;gap:10px}
h1{font-size:16px;margin-right:auto}
.tabs{display:flex;gap:4px}.tabs button{border:0;background:none;font:inherit;padding:6px 14px;border-radius:8px;color:var(--mu);cursor:pointer}.tabs .on{background:var(--acb);color:var(--ac);font-weight:700}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;gap:10px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 2fr}
.k{display:flex;flex-direction:column;padding:10px 12px;margin:0}.k span{font-size:12px;color:var(--mu)}.k b{font-size:20px}
#kpi{grid-template-columns:repeat(4,1fr);margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:860px){.cols{grid-template-columns:3fr 2fr;align-items:start}}
@media(max-width:600px){.g3,.g2{grid-template-columns:1fr}#kpi{grid-template-columns:repeat(2,1fr)}}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acb);border-color:var(--ac)}
textarea{resize:vertical}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.seg button{flex:1;padding:8px 2px;border:0;background:#fff;font:inherit;color:var(--mu);cursor:pointer}.seg .on{background:var(--ac);color:#fff}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.chips button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:2px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn{border:0;background:var(--ac);color:#fff;font:inherit;font-weight:700;padding:11px 18px;border-radius:10px;cursor:pointer}.btn:disabled{opacity:.6}
.btn.sec{background:#fff;color:var(--ac);border:1px solid var(--ac)}
.lk{border:0;background:none;color:var(--ac);font:inherit;font-size:12px;cursor:pointer;padding:2px 6px}
.row{display:flex;align-items:center;gap:8px}.row b.tt{flex:1}.mu{color:var(--mu);font-size:12px}
.t{border-top:1px solid var(--bd);padding:10px 0}.t:first-child{border:0}.d{white-space:pre-wrap;font-size:13px;margin-top:4px}.ac{text-align:right}
.b{font-size:11px;padding:1px 8px;border-radius:99px;font-weight:500}.ok{background:var(--okb);color:var(--ok)}.ing{background:var(--acb);color:var(--ac)}.hold{background:var(--wab);color:var(--wa)}
.em{color:var(--mu);text-align:center;padding:18px 0}
pre{white-space:pre-wrap;font:12px/1.6 'Noto Sans KR',monospace;background:var(--bg);padding:10px;border-radius:8px;max-height:260px;overflow:auto}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);padding:10px 14px}.bar div{max-width:960px;margin:auto;display:flex;gap:8px}.bar .btn{flex:1}.bar .sec{flex:0 0 auto}
.br{display:grid;grid-template-columns:96px 1fr 96px;gap:8px;align-items:center;font-size:12px;margin:6px 0}.br i{display:block;height:10px;border-radius:5px;background:var(--ac)}.br em{font-style:normal;color:var(--mu);text-align:right}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}#toast.show{opacity:1}
</style></head><body>
<header><div class="hd"><h1>📋 일일업무 로그</h1><nav class="tabs"><button class="on" data-p="w">작성</button><button data-p="s">통계</button></nav></div></header>
<main class="w">
<section id="pw">
 <div class="card g g3"><div><label>보고 일자</label><input type="date" id="date"></div><div><label>작성자</label><input id="name" placeholder="홍길동"></div><div><label>소속</label><select id="dept"></select></div></div>
 <div class="g" id="kpi"></div>
 <div class="cols"><div>
  <form class="card" id="f">
   <div class="g g2"><div><label>카테고리</label><select id="cat"></select></div><div><label>업무명</label><input id="title" required placeholder="예: 니페딕스지속정 PV 샘플링"></div></div>
   <label style="margin-top:10px">상세 내용 (선택)</label><textarea id="desc" rows="2" placeholder="세부 진행 내용, 성과"></textarea>
   <div class="g g3" style="margin-top:10px">
    <div><label>진행 상태</label><div class="seg" id="st"><button type="button" data-v="완료">완료</button><button type="button" data-v="진행중">진행중</button><button type="button" data-v="보류">보류</button></div></div>
    <div><label>우선순위</label><div class="seg" id="pr"><button type="button" data-v="상">상</button><button type="button" data-v="중">중</button><button type="button" data-v="하">하</button></div></div>
    <div><label>소요 시간(h)</label><input type="number" id="hrs" step="0.5" min="0" max="24" value="1"><div class="chips" id="hc"></div></div>
   </div>
   <div style="text-align:right;margin-top:12px"><button type="button" class="lk" id="cx" hidden>수정 취소</button> <button class="btn" id="add">업무 추가</button></div>
  </form>
  <div class="card"><div class="row"><b style="flex:1">업무 목록</b><button type="button" class="lk" id="carry">↺ 이전 미완료 업무 가져오기</button></div><div id="list"></div></div>
 </div><div>
  <div class="card"><label>⚠️ 특이사항 · 건의사항</label><textarea id="issues" rows="3"></textarea><label style="margin-top:10px">📅 내일 예정 업무</label><textarea id="plan" rows="3"></textarea></div>
  <div class="card"><div class="row"><b style="flex:1">보고 텍스트</b><button type="button" class="lk" id="copy">복사</button></div><pre id="pv"></pre></div>
 </div></div>
</section>
<section id="ps" hidden>
 <div class="card row"><select id="rng" style="width:auto"><option value="7">최근 7일</option><option value="30" selected>최근 30일</option><option value="0">전체</option></select><span class="mu" id="src"></span></div>
 <div id="sc"></div>
</section>
</main>
<div class="bar" id="bar"><div><button class="btn sec" id="copy2">텍스트 복사</button><button class="btn" id="send">구글 시트로 제출</button></div></div>
<div id="toast"></div>
<script>
const CFG={
 URL:"https://script.google.com/a/macros/ekdp.com/s/AKfycbyYevG-ry65AcT8n00vbJRSi4EXcA4c8Q_Mb63Arcy3/exec",
 CATS:["루틴 업무","프로젝트","트러블슈팅/이슈","회의/논의","교육/세미나","기타"],
 DEPTS:["품질관리1팀","품질관리2팀","품질보증팀","연구개발팀","생산관리팀","기타"],
 HRS:[0.5,1,2,3,4]};
const $=i=>document.getElementById(i),M={'완료':'ok','진행중':'ing','보류':'hold'};
const ls=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tasks=[],editId=null,sent=false,hist=ls('dwl_h',[]);
function seg(id,v){const e=$(id);e.dataset.v=v;[...e.children].forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
function save(){sv('dwl_d',{date:$('date').value,name:$('name').value,dept:$('dept').value,issues:$('issues').value,plan:$('plan').value,tasks,sent})}
function report(){
 const h=tasks.reduce((a,t)=>a+t.hours,0);
 let s=`📋 [일일 업무 보고]\n• 일자: ${$('date').value}\n• 작성자: ${$('name').value||'-'} (${$('dept').value})\n• 총 소요시간: ${h.toFixed(1)}h\n\n✅ 금일 업무\n`;
 s+=tasks.length?tasks.map((t,i)=>`${i+1}. [${t.cat}] ${t.title} (${t.status}/${t.hours}h)`+(t.desc?'\n'+t.desc.split('\n').map(l=>'   - '+l).join('\n'):'')).join('\n'):'(없음)';
 if($('issues').value.trim())s+=`\n\n⚠️ 특이사항\n${$('issues').value.trim()}`;
 if($('plan').value.trim())s+=`\n\n📅 내일 예정\n${$('plan').value.trim()}`;
 return s}
function render(){
 const dn=tasks.filter(t=>t.status==='완료').length,h=tasks.reduce((a,t)=>a+t.hours,0);
 $('kpi').innerHTML=[['총 업무',tasks.length+'건'],['완료',dn+'건'],['진행·보류',(tasks.length-dn)+'건'],['총 시간',h.toFixed(1)+'h']].map(x=>`<div class="card k"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
 $('list').innerHTML=tasks.length?tasks.map(t=>`<div class="t"><div class="row"><span class="b ${M[t.status]}">${t.status}</span><b class="tt">${esc(t.title)}</b><span class="mu">${t.hours}h</span></div><div class="mu">${esc(t.cat)} · 우선순위 ${t.pri}</div>${t.desc?`<div class="d">${esc(t.desc)}</div>`:''}<div class="ac"><button class="lk" onclick="edit(${t.id})">수정</button><button class="lk" onclick="del(${t.id})">삭제</button></div></div>`).join(''):'<p class="em">아직 업무가 없어요. 위에서 추가해 보세요.</p>';
 $('pv').textContent=report();save()}
function resetForm(){editId=null;$('title').value='';$('desc').value='';$('hrs').value=1;$('add').textContent='업무 추가';$('cx').hidden=true}
function edit(id){const t=tasks.find(x=>x.id===id);if(!t)return;editId=id;$('cat').value=t.cat;$('title').value=t.title;$('desc').value=t.desc;$('hrs').value=t.hours;seg('st',t.status);seg('pr',t.pri);$('add').textContent='수정 저장';$('cx').hidden=false;$('title').focus();scrollTo({top:0,behavior:'smooth'})}
function del(id){tasks=tasks.filter(t=>t.id!==id);sent=false;render()}
$('f').onsubmit=e=>{e.preventDefault();
 const t={id:editId||Date.now(),cat:$('cat').value,title:$('title').value.trim(),desc:$('desc').value.trim(),status:$('st').dataset.v,pri:$('pr').dataset.v,hours:parseFloat($('hrs').value)||0};
 if(editId)tasks=tasks.map(x=>x.id===editId?t:x);else tasks.push(t);
 sent=false;resetForm();render();toast('업무를 저장했어요')};
$('cx').onclick=resetForm;
$('carry').onclick=()=>{
 const h=hist.filter(x=>x.date<$('date').value).sort((a,b)=>b.date.localeCompare(a.date))[0];
 const u=h?h.tasks.filter(t=>t.status!=='완료'&&!tasks.some(x=>x.title===t.title)):[];
 if(!u.length)return toast('가져올 미완료 업무가 없어요');
 u.forEach((t,i)=>tasks.push({...t,id:Date.now()+i,hours:0}));sent=false;render();toast(u.length+'건을 가져왔어요. 소요시간을 입력해 주세요')};
function copy(){const t=report();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}).then(()=>toast('보고 텍스트를 복사했어요'))}
$('copy').onclick=$('copy2').onclick=copy;
$('send').onclick=async()=>{
 const name=$('name').value.trim();
 if(!name){toast('작성자 이름을 입력해 주세요');$('name').focus();return}
 if(!tasks.length&&!confirm('업무가 없습니다. 특이사항·내일 계획만 제출할까요?'))return;
 const b=$('send'),date=$('date').value;b.disabled=true;b.textContent='전송 중…';
 const payload={reportDate:date,userName:name,department:$('dept').value,issues:$('issues').value.trim(),tomorrowPlan:$('plan').value.trim(),tasks:tasks.map(t=>({category:t.cat,title:t.title,desc:t.desc,status:t.status,priority:t.pri,hours:t.hours}))};
 try{
  await fetch(CFG.URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  hist=hist.filter(h=>!(h.date===date&&h.name===name));hist.push({date,name,tasks});sv('dwl_h',hist);sent=true;save();
  toast('전송했어요. 시트에 반영됐는지 확인해 주세요');
 }catch(e){toast('전송 실패: 네트워크를 확인해 주세요')}
 b.disabled=false;b.textContent='구글 시트로 제출'};
async function stats(){
 const n=+$('rng').value,u=$('name').value.trim();let rows=null,src='이 기기의 제출 기록';
 try{const r=await fetch(CFG.URL+'?user='+encodeURIComponent(u)),j=await r.json();if(Array.isArray(j.rows)){rows=j.rows;src='구글 시트'}}catch(e){}
 if(!rows)rows=hist.filter(h=>!u||h.name===u).flatMap(h=>h.tasks.map(t=>({date:h.date,category:t.cat,status:t.status,hours:t.hours})));
 if(n){const c=new Date();c.setDate(c.getDate()-n);const cs=ymd(c);rows=rows.filter(r=>r.date>=cs)}
 $('src').textContent='기준: '+src;
 if(!rows.length){$('sc').innerHTML='<p class="em">통계를 낼 기록이 아직 없어요. 제출하면 여기에 쌓입니다.</p>';return}
 const days={},cats={};let tot=0;
 rows.forEach(r=>{days[r.date]=(days[r.date]||0)+r.hours;cats[r.category]=(cats[r.category]||0)+r.hours;tot+=r.hours});
 const dn=rows.filter(r=>r.status==='완료').length,nd=Object.keys(days).length;
 const bars=(o,lab)=>{const e=Object.entries(o),m=Math.max(...e.map(x=>x[1]),1);return e.map(x=>`<div class="br"><span>${esc(lab?lab(x[0]):x[0])}</span><i style="width:${x[1]/m*100}%"></i><em>${x[1].toFixed(1)}h${tot?' ('+Math.round(x[1]/tot*100)+'%)':''}</em></div>`).join('')};
 const cs=Object.fromEntries(Object.entries(cats).sort((a,b)=>b[1]-a[1]));
 const ds=Object.fromEntries(Object.entries(days).sort().slice(-14));
 $('sc').innerHTML=`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:12px">${[['총 소요시간',tot.toFixed(1)+'h'],['업무 건수',rows.length+'건'],['완료율',Math.round(dn/rows.length*100)+'%'],['보고 일수',nd+'일'],['일평균',(tot/nd).toFixed(1)+'h']].map(x=>`<div class="card k"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
 <div class="card"><b>카테고리별 소요시간</b>${bars(cs)}</div><div class="card"><b>일자별 소요시간 (최근 14일)</b>${bars(ds,k=>k.slice(5))}</div>`}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 const w=b.dataset.p==='w';$('pw').hidden=!w;$('ps').hidden=w;$('bar').hidden=!w;if(!w)stats()});
$('rng').onchange=stats;
document.querySelectorAll('.seg').forEach(e=>e.onclick=ev=>{const v=ev.target.dataset.v;if(v)seg(e.id,v)});
$('hc').onclick=e=>{if(e.target.dataset.h)$('hrs').value=e.target.dataset.h};
['date','name','dept','issues','plan'].forEach(i=>$(i).oninput=()=>{sent=false;render()});
(function(){
 $('cat').innerHTML=CFG.CATS.map(c=>`<option>${c}</option>`).join('');
 $('dept').innerHTML=CFG.DEPTS.map(c=>`<option>${c}</option>`).join('');
 $('hc').innerHTML=CFG.HRS.map(h=>`<button type="button" data-h="${h}">${h}h</button>`).join('');
 const d=ls('dwl_d',{}),t=ymd(new Date());
 $('name').value=d.name||'';if(d.dept)$('dept').value=d.dept;
 if(d.sent&&d.date<t){$('date').value=t}
 else{$('date').value=d.date||t;tasks=d.tasks||[];$('issues').value=d.issues||'';$('plan').value=d.plan||'';sent=!!d.sent}
 seg('st','진행중');seg('pr','중');render()})();
</script></body></html>
